version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This action's version tag selects the compiler under test. Rust 1.85
      # is the project's deliberate MSRV, not an outdated action dependency.
      - dependency-name: dtolnay/rust-toolchain
